# ==============================================================================
# Netlify Deployment Configuration for AsamBasa Lab (Vite + React SPA)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA Fallback: Route all incoming paths to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
